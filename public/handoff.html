<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e7a45" />
    <title>Return to Grocery Gitter</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100svh;
        min-height: var(--vv-height, 100svh);
        display: grid;
        place-items: center;
        padding: calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));
        font-family: "Avenir Next", "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        background: #f4efe6;
        color: #1c1917;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #1c221e; color: #f3efe6; }
      }
      main { width: min(28rem, 100%); display: flex; flex-direction: column; gap: 12px; }
      h1 { font-family: Palatino, Georgia, serif; font-size: 2rem; line-height: 1.15; margin: 0; }
      p { margin: 0; line-height: 1.4; }
      a {
        display: block;
        text-align: center;
        text-decoration: none;
        border-radius: 16px;
        min-height: 52px;
        line-height: 52px;
        font-weight: 750;
      }
      #back { background: #0e7a45; color: #fff; }
      #next { background: transparent; color: inherit; border: 1px solid #c8bfb0; }
      .note { color: #5c5348; font-size: 0.95rem; }
      @media (prefers-color-scheme: dark) {
        .note { color: #c3baac; }
        #next { border-color: #3d463f; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Return to Grocery Gitter</h1>
      <p id="body">Your trip is in the other tab. This page shares it back there.</p>
      <a id="back" href="/">Back to my trip</a>
      <a id="next" hidden rel="noopener">Continue</a>
      <p class="note">You can stay in Chrome. Grocery Gitter does not need to be installed on your home screen.</p>
    </main>
    <script type="module" src="/shopper/handoffTab.js"></script>
  </body>
</html>
